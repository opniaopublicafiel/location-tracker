[build]
  command = "pip install -r requirements.txt"
  publish = "public"
  functions = "netlify/functions"

[functions]
  [functions.runtime]
    name = "python"
    version = "3.10"

[[redirects]]
  from = "/admin"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
